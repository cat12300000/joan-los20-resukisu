name: Build joan LOS20 ReSukiSU+SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libelf-dev \
            wget curl unzip python3 python3-pip device-tree-compiler \
            xz-utils ca-certificates build-essential

      - name: Toolchains
        run: |
          mkdir -p $HOME/tc
          git clone --depth 1 https://github.com/kdrag0n/proton-clang $HOME/tc/clang
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/tc/gcc64
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/tc/gcc32
          test -x $HOME/tc/clang/bin/clang
          echo "$HOME/tc/clang/bin" >> $GITHUB_PATH
          echo "$HOME/tc/gcc64/bin" >> $GITHUB_PATH
          echo "$HOME/tc/gcc32/bin" >> $GITHUB_PATH

      - name: Clone LOS 20 kernel
        run: |
          git clone --depth 1 -b lineage-20 \
            https://github.com/LineageOS/android_kernel_lge_msm8998.git kernel
          cd kernel
          git fetch --unshallow || true

      - name: Integrate ReSukiSU (SUSFS-capable branch)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s susfs-dev

      - name: Apply 4.4 SUSFS inline hooks
        working-directory: kernel
        run: |
          curl -LSs -o susfs_inline_hook_patches.sh \
            https://raw.githubusercontent.com/ardhailhamkusuma9/android_kernel_lge_msm8998/res/susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh || true

      - name: Integrate susfs4ksu core (kernel-4.9 patchset, closest to 4.4)
        working-directory: kernel
        run: |
          git clone --depth 1 -b kernel-4.9 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          echo "=== Copying ALL susfs core files ==="
          cp -v /tmp/susfs4ksu/kernel_patches/fs/* fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/

          echo "=== Attempting 50_add_susfs_in_kernel-4.9.patch (fuzz allowed, not fatal) ==="
          patch -p1 --fuzz=3 -f < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch || true

          echo ""
          echo "=== Reject files ==="
          find . -name "*.rej" | sort

          echo ""
          echo "=== SUSFS_VERSION now readable? ==="
          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h || true

          echo ""
          echo "=== Every extern function declaration in include/linux/susfs.h ==="
          grep -n "^extern" include/linux/susfs.h || echo "NONE FOUND"

          echo ""
          echo "=== Every mention of 'no_su' anywhere in susfs.h / susfs_def.h / susfs.c ==="
          grep -n "no_su" include/linux/susfs.h include/linux/susfs_def.h fs/susfs.c || echo "NONE FOUND"

          echo ""
          echo "=== Every mention of 'unprivillege' or 'unprivileged' anywhere in susfs core files ==="
          grep -rn "unprivilleg\|unprivileg" include/linux/susfs.h include/linux/susfs_def.h fs/susfs.c || echo "NONE FOUND"

          echo ""
          echo "=== Does fs/susfs.c define a function whose name is CLOSE to susfs_is_current_proc_no_su? ==="
          grep -n "^bool susfs_\|^static.*susfs_is_current" fs/susfs.c | head -40 || echo "NONE FOUND"

          echo ""
          echo "=== KernelSU/kernel/feature/sucompat.h (full file — defines the macro alias) ==="
          cat KernelSU/kernel/feature/sucompat.h || true

          echo ""
          echo "=== Does fs/open.c already #include anything ksu/susfs-related? ==="
          grep -n "#include" fs/open.c | grep -iE "ksu|susfs" || echo "NONE FOUND"

          echo ""
          echo "=== Does any already-working file (e.g. fs/exec.c, patched earlier by inline hooks) show us the right include? ==="
          grep -n "#include" fs/exec.c | grep -iE "ksu|susfs" || echo "NONE FOUND"

          echo ""
          echo "=== Where does ksu_is_current_proc_unprivillege actually get DEFINED (not just macro'd)? ==="
          grep -rn "ksu_is_current_proc_unprivillege" --include="*.c" --include="*.h" . || echo "NONE FOUND"

          echo ""
          echo "=== What's the relative include path from fs/ to KernelSU/kernel/feature/sucompat.h? ==="
          find . -iname "sucompat.h"

          echo ""
          echo "=== Is there a drivers/kernelsu symlink, and where does it point? ==="
          ls -la drivers/kernelsu 2>&1 || true

      - name: Diagnose SUSFS integration check
        working-directory: kernel
        run: |
          echo "=== Kbuild check that's failing (around line 197) ==="
          sed -n '180,210p' drivers/kernelsu/Kbuild
          echo ""
          echo "=== Does fs/susfs.c exist? ==="
          ls -la fs/susfs.c 2>&1 || echo "NOT FOUND"
          echo ""
          echo "=== Does include/linux/susfs.h exist? ==="
          ls -la include/linux/susfs.h 2>&1 || echo "NOT FOUND"

      - name: Enable KSU + SUSFS in defconfig
        working-directory: kernel
        run: |
          CFG=arch/arm64/configs/lineageos_joan_defconfig
          cat >> "$CFG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_OVERLAY_FS=y
          EOF
          sed -i 's/^        //' "$CFG"

      - name: Build
        working-directory: kernel
        run: |
          SYS_LD="$(PATH=/usr/bin:/bin command -v ld)"
          echo "System ld resolved to: $SYS_LD"
          sudo ln -sf "$SYS_LD" "$HOME/tc/clang/bin/ld"
          ls -la "$HOME/tc/clang/bin/ld"
          file "$HOME/tc/clang/bin/ld"

          export PATH="$HOME/tc/clang/bin:$HOME/tc/gcc64/bin:$HOME/tc/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          mkdir -p out
          make O=out lineageos_joan_defconfig
          make O=out -j$(nproc) \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-Wno-error"
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/banner ak3/README*
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cp anykernel.sh ak3/anykernel.sh
          cd ak3
          zip -r9 ../AK3-LOS20-Joan_ReSukiSU-SUSFS.zip * -x '*.git*'
          ls -lh ../AK3-LOS20-Joan_ReSukiSU-SUSFS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AK3-LOS20-Joan_ReSukiSU-SUSFS
          path: AK3-LOS20-Joan_ReSukiSU-SUSFS.zip
